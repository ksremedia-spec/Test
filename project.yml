# XcodeGen spec.
#
# Gameplan.xcodeproj is committed and should open directly. This spec exists as a
# regeneration path: if the project file is ever damaged, or you want to change
# targets/settings declaratively, `make project` rebuilds an equivalent project
# from this file.
#
#   brew install xcodegen && make project

name: Gameplan
options:
  bundleIdPrefix: com.gameplan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_WARN_ABOUT_RETURN_TYPE: YES_ERROR
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES

targets:
  Gameplan:
    type: application
    platform: iOS
    sources:
      - path: Gameplan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gameplan.fantasy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Gameplan
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES

  GameplanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GameplanTests
    dependencies:
      - target: Gameplan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gameplan.fantasy.tests

schemes:
  Gameplan:
    build:
      targets:
        Gameplan: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GameplanTests
