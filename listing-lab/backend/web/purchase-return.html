<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Returning to the app — Listing Lab</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Where Stripe sends the iPhone app's customer after Checkout (10 Sep 2026).
     One job: hand back to the app. Same tokens and chrome as founder.html. */
  :root{
    --paper:#0F141B; --paper-2:#151C25; --ink:#E9EDF3; --ink-soft:#A6B1BF; --ink-faint:#75818F;
    --pine:#4E8FD0; --pine-bright:#66A2DE; --line:#2A3545;
    --display:"Fraunces","Iowan Old Style",Georgia,serif; --ui:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --grad:linear-gradient(105deg,#5CC7F0 0%,#7FA8EC 45%,#8A7FE8 100%);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{color-scheme:dark}
  body{min-height:100dvh;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1120px;margin:0 auto;padding:0 24px;width:100%}

  .site-nav{background:rgba(15,20,27,.88);border-bottom:1px solid var(--line)}
  .site-nav-row{display:flex;align-items:center;justify-content:space-between;gap:16px;height:76px}
  .mark{display:inline-flex;align-items:center;gap:11px;font-weight:800;font-size:1.24rem;letter-spacing:.11em;text-transform:uppercase}
  .mark img{width:46px;height:46px;flex:none}
  .mark .lab{margin-left:-.18em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  @media(max-width:420px){.mark{font-size:1.02rem;gap:8px}.mark img{width:38px;height:38px}}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 24px;border-radius:999px;border:1px solid transparent;font-size:.92rem;font-weight:600;letter-spacing:.01em;white-space:nowrap;transition:background .18s,border-color .18s,transform .18s}
  .btn:active{transform:scale(.97)}
  .btn-primary{background:var(--pine);color:#0A1017;box-shadow:0 8px 22px -10px rgba(78,143,208,.45)}
  .btn-primary:hover{background:var(--pine-bright)}

  main{flex:1;display:flex;align-items:center;position:relative;overflow:hidden;padding:56px 0}
  main::before{content:"";position:absolute;inset:-40% -20% auto;height:120%;background:radial-gradient(60% 50% at 30% 30%,rgba(78,143,208,.16),transparent 70%);pointer-events:none}
  .box{position:relative;max-width:560px;margin:0 auto;border:1px solid var(--line);border-radius:18px;padding:36px 40px;background:var(--paper-2);text-align:center}
  .eyebrow{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--pine);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:500;font-size:clamp(1.7rem,4vw,2.3rem);line-height:1.12;letter-spacing:-.01em;text-wrap:balance}
  .box .btn{margin-top:26px}
  .quiet{margin-top:18px;font-size:.9rem;color:var(--ink-faint)}
  @media(max-width:560px){.box{padding:28px 22px}}

  footer{border-top:1px solid var(--line);padding:26px 0 44px;color:var(--ink-faint);font-size:.85rem}
  footer .wrap{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
  footer a:hover{color:var(--ink)}
</style>
</head>
<body>
<header class="site-nav">
  <div class="wrap site-nav-row">
    <a href="/" class="mark"><img src="/logo-full.png" alt="" width="46" height="46" decoding="async"><span>Listing&nbsp;<span class="lab">Lab</span></span></a>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="box">
      <div class="eyebrow">Credits</div>
      <h1 id="headline">Returning you to the app…</h1>
      <a id="open" class="btn btn-primary" href="listinglab://purchase?status=cancelled">Open Listing Lab</a>
      <p class="quiet">You can also just switch back to the app.</p>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>© 2026 Horizon Home Media</span>
    <span><a href="/terms">Terms</a> · <a href="/privacy">Privacy</a> · <a href="/faq">FAQ</a></span>
  </div>
</footer>

<script>
  // Stripe sends ?status=success or ?status=cancelled. The app registered the
  // listinglab:// scheme; opening it brings the person straight back. The
  // button does the same by hand, for a browser that blocks the automatic jump.
  (function () {
    var status = new URLSearchParams(location.search).get('status') === 'success' ? 'success' : 'cancelled';
    var target = 'listinglab://purchase?status=' + status;
    document.getElementById('headline').textContent = status === 'success'
      ? 'Payment received — returning you to the app…'
      : 'No charge — returning you to the app…';
    document.getElementById('open').setAttribute('href', target);
    location.href = target;
  })();
</script>
</body>
</html>
