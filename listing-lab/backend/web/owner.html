<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Owner — Listing Lab</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3">
<style>
  :root{
    --bg:#0C1118; --surface:#131A24; --line:#293546;
    --ink:#E9EDF3; --soft:#A0ABBA; --faint:#6B7787; --pine:#6EA5E1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink); min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    font:16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:34px 30px; width:min(92vw, 380px);
  }
  .brand{display:flex; align-items:center; gap:12px; margin-bottom:18px;}
  .brand img{width:40px; height:40px; border-radius:10px;}
  .brand b{font-size:19px; letter-spacing:-.01em;}
  .brand b span{color:var(--pine);}
  p{color:var(--soft); font-size:14.5px; margin:0 0 18px;}
  input{
    width:100%; padding:13px 14px; border-radius:10px; font-size:16px;
    background:#19222E; border:1px solid var(--line); color:var(--ink);
  }
  input:focus{outline:none; border-color:var(--pine);}
  button{
    width:100%; margin-top:12px; padding:13px; border:0; border-radius:10px;
    background:var(--pine); color:#0A141F; font-size:16px; font-weight:700; cursor:pointer;
  }
  .faint{color:var(--faint); font-size:12.5px; margin-top:14px; text-align:center;}
  .faint a{color:inherit;}
</style>
</head>
<body>
  <!-- The owner's front door. Submitting sends the key as ?s= — exactly the URL
       the board already expects, so this page adds convenience, not a second
       auth system. A wrong key gets the same 404 as ever. Browsers offer to
       remember the key because this is a real password field in a real form. -->
  <form class="card" action="/internal/board" method="get">
    <div class="brand"><img src="/icon-192.png?v=3" alt=""><b>Listing <span>Lab</span></b></div>
    <p>Owner access. Enter the dashboard key.</p>
    <input type="password" name="s" placeholder="Dashboard key" autocomplete="current-password" required autofocus>
    <button type="submit">Open dashboard</button>
    <div class="faint"><a href="/">← back to the site</a></div>
  </form>
</body>
</html>
